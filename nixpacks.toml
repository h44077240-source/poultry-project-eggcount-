[phases.setup]
nixPkgs = ["python311", "ffmpeg", "libGL", "glib"]

[phases.install]
cmds = [
  "python -m venv /opt/venv",
  ". /opt/venv/bin/activate",
  "pip install --no-cache-dir --upgrade pip",
  "pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu",
  "pip install --no-cache-dir -r requirements.txt",
  "pip uninstall -y opencv-python || true",
  "pip install --no-cache-dir --force-reinstall opencv-python-headless"
]

[variables]
LD_LIBRARY_PATH = "/root/.nix-profile/lib:/nix/var/nix/profiles/default/lib"

[start]
cmd = "export LD_LIBRARY_PATH=/root/.nix-profile/lib:/nix/var/nix/profiles/default/lib:$LD_LIBRARY_PATH && cd backend && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
