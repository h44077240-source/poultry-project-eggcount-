[phases.setup]
nixPkgs = ["...", "python311", "ffmpeg", "libGL", "glib", "gcc-unwrapped", "zlib"]
nixLibs = ["...", "gcc-unwrapped", "zlib", "libGL", "glib"]

[phases.install]
cmds = [
  "python -m venv /opt/venv",
  "/opt/venv/bin/python -m pip install --no-cache-dir --upgrade pip",
  "/opt/venv/bin/python -m pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu",
  "/opt/venv/bin/python -m pip install --no-cache-dir \"numpy>=1.24.0,<2.0.0\" -r requirements.txt",
  "/opt/venv/bin/python -m pip uninstall -y opencv-python || true",
  "/opt/venv/bin/python -m pip install --no-cache-dir --force-reinstall opencv-python-headless"
]

[variables]
PATH = "/opt/venv/bin:$PATH"
VIRTUAL_ENV = "/opt/venv"
LD_LIBRARY_PATH = "/root/.nix-profile/lib:/nix/var/nix/profiles/default/lib"

[start]
cmd = "export LD_LIBRARY_PATH=$(find /nix/store -name 'libstdc++.so.6' -exec dirname {} \\; 2>/dev/null | head -n 1):/root/.nix-profile/lib:/nix/var/nix/profiles/default/lib:$LD_LIBRARY_PATH && export PATH=/opt/venv/bin:$PATH && cd backend && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
